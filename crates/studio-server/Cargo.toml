[package]
name = "studio-server"
version = "0.1.0"
description = "The studio backend over stdio, for the VS Code extension"
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "studio-server"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
studio-app = { path = "../studio-app" }
studio-carriers = { path = "../studio-carriers" }
studio-core = { path = "../studio-core" }
studio-dwarf = { path = "../studio-dwarf" }

[dev-dependencies]
tempfile = "3"
