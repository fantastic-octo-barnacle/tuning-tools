[workspace]
resolver = "2"
members = ["crates/studio-dwarf", "crates/studio-carriers", "crates/studio-core", "src-tauri"]
# Standalone firmware project used to (re)build a Rust ELF fixture.
exclude = ["crates/studio-dwarf/tests/fixtures/rust_embedded"]

[workspace.package]
edition = "2021"
license = "MIT"
authors = ["hxyulin <hxyulin@proton.me>"]

[workspace.dependencies]
gimli = { version = "0.32", default-features = false, features = ["read", "std"] }
object = { version = "0.38", default-features = false, features = ["read", "elf", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

# Release profile lives at the workspace root; member profiles are ignored.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
